name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NetworkX and Shapely for the Adelaide checks
        run: pip install -r tools/requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check the Adelaide searches against NetworkX (must not skip)
        # A skipped run ends "OK (skipped=7)", so a bare "OK" proves all 7 tests ran.
        run: python -m unittest tests.test_adelaide_routes -v 2>&1 | tee /dev/stderr | grep -qx OK
      - name: Run benchmark
        run: python benchmark.py
      - name: Check the browser demo matches the Python code
        run: node tests/compare_js.js
      - name: Check the shared map camera
        run: node tests/test_view.js
